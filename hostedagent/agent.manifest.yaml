name: AgentVerseWorkflowAgent
description: >
  Hosted AgentVerse workflow that analyzes uploaded documents/images with Azure
  Content Understanding, routes with AgentVerseIntakeAgent, and calls the
  financial, medical, supply, or manual review prompt agent.
metadata:
  tags:
    - AgentVerse
    - Content Understanding
    - Foundry workflow
    - Responses Protocol
template:
  name: AgentVerseWorkflowAgent
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_PROJECT_ENDPOINT
      value: "{{AZURE_AI_PROJECT_ENDPOINT}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: CONTENT_UNDERSTANDING_ENDPOINT
      value: "{{CONTENT_UNDERSTANDING_ENDPOINT}}"
    - name: AGENTVERSE_USE_DEFAULT_AZURE_CREDENTIAL
      value: "1"
