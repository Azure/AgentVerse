name: Public website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/*/agentverse.yaml"
      - "src/*/*.md"
      - "src/templates/catalog/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "src/*/agentverse.yaml"
      - "src/*/*.md"
      - "src/templates/catalog/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install catalog dependencies
        run: python -m pip install -r website/requirements.txt
      - name: Check site content and links
        run: python -m unittest discover -s website -p "test_*.py"
      - name: Build public site
        run: python website/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
