# AgentVerse platform CI — validates the global deploy and builds every image.
#
# Runs on changes to the platform (infra), the portal, the catalog manifests or
# the catalog tooling. It never touches Azure: it validates configuration and
# proves that every container image builds. The real deployment (terraform
# apply / az acr build) is run by an operator, not by CI.

name: platform-ci

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "portal/**"
      - "src/*/agentverse.yaml"
      - "src/templates/catalog/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - "portal/**"
      - "src/*/agentverse.yaml"
      - "src/templates/catalog/**"
      - ".github/workflows/platform-ci.yml"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validate manifests, (re)build the catalog and check catalog <-> topology
  #    consistency. Publishes catalog.json for the image job to bake into the
  #    portal image.
  # ---------------------------------------------------------------------------
  catalog:
    name: Catalog & consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install catalog tooling
        run: pip install pyyaml jsonschema

      - name: Validate every demo manifest
        run: python src/templates/catalog/build_catalog.py --check

      - name: Build the catalog index
        run: python src/templates/catalog/build_catalog.py --write

      - name: Bake the catalog into the portal build context
        run: cp src/catalog.json portal/public/catalog.json

      - name: Catalog <-> Terraform topology consistency
        run: python infra/scripts/check-consistency.py

      - name: Upload catalog + portal context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-public
          path: portal/public/catalog.json

  # ---------------------------------------------------------------------------
  # 2. Terraform format + validate (no backend, no cloud calls).
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.5"

      - name: Format check
        run: terraform fmt -recursive -check

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # 3. Build every container image (no push) to prove the Dockerfiles compile.
  # ---------------------------------------------------------------------------
  images:
    name: Build image
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portal
            context: portal
            file: portal/Dockerfile
          - name: foundryairlines-web
            context: src/foundryairlines-demo
            file: src/foundryairlines-demo/Dockerfile
          - name: insurance-backend
            context: src/insurance-ai-agents
            file: src/insurance-ai-agents/backend/Dockerfile
          - name: insurance-dashboard
            context: src/insurance-ai-agents/dashboard
            file: src/insurance-ai-agents/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The portal bakes catalog.json — pull the version produced by the catalog job.
      - name: Restore catalog for the portal
        if: matrix.name == 'portal'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portal-public
          path: portal/public

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
