server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config must never be cached (it changes per deployment).
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /catalog.json {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
